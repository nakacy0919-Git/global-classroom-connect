name: GCC regression checks

on:
  push:
    branches:
      - main
      - fix/gcc-preserve-rooms-on-new-registrations-20261026
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all regression tests
        run: node --test
      - name: Build production bundle
        run: npm run build
      - name: Check whitespace errors
        run: git diff --check
