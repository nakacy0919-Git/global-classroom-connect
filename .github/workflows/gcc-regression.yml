name: GCC regression checks

on:
  push:
    branches:
      - main
      - fix/gcc-preserve-rooms-on-new-registrations-20261026
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all regression tests
        run: node --test
      - name: Build production bundle
        run: npm run build
      - name: Browser smoke test — public teacher signup and protected host route
        run: bash scripts/gcc-public-browser-smoke.sh
      - name: Check whitespace errors
        run: git diff --check


  sql-isolated-test:
    name: Isolated Supabase SQL release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gcc_ci_disposable_only
          POSTGRES_DB: gcc_v231_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gcc_v231_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apply staged SQL and check authorization in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: gcc_ci_disposable_only
          PGDATABASE: gcc_v231_ci
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v231_fixture.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v231_teacher_browse_paged.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v226_registration_console.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v227_english_name_search_path.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v233_scope_legacy_signup_overview.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v231_assertions.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v233_legacy_scope_assertions.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v234_mail_partner_fixture.sql
          # Test the exact contact-table/RPC section, without unrelated historical migrations.
          awk '/^-- The age range is supplied/{exit} {print}' supabase/migrations/20261104_gcc_v218_partner_contact.sql | psql -v ON_ERROR_STOP=1
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261104_gcc_v219_host_join_email_outbox.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261105_gcc_v2191_claim_email_recipient_text.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v234_mail_partner_assertions.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v236_roster_guard_fixture.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v236_roster_admission_guard.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v236_roster_guard_assertions.sql
          bash scripts/gcc-roster-guard-concurrency.sh
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v237_invite_fixture.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v237_event_invitation_guard.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v237_invite_assertions.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v238_verified_fixture.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v238_verified_roster_guard.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v238_verified_assertions.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v239_bot_fixture.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v239_bot_receipt_guard.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v239_bot_assertions.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v232_trigger_fixture.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v232_restrict_trigger_execute.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v232_trigger_assertions.sql


  postgrest-http-security:
    name: JWT/HTTP authorization through isolated PostgREST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gcc_ci_disposable_only
          POSTGRES_DB: gcc_v231_http_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gcc_v231_http_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Seed isolated database and staged GCC REST functions
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: gcc_ci_disposable_only
          PGDATABASE: gcc_v231_http_ci
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/sql/gcc_v231_fixture.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v231_teacher_browse_paged.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v226_registration_console.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v227_english_name_search_path.sql
          psql -v ON_ERROR_STOP=1 -f sql/gcc_v233_scope_legacy_signup_overview.sql
      - name: Start an ephemeral PostgREST and verify actual HTTP JWT boundaries
        env:
          GCC_TEST_JWT_SECRET: gcc-ephemeral-postgrest-ci-only-secret-2026
          GCC_TEST_POSTGREST_URL: http://127.0.0.1:3400
        run: |
          set -euo pipefail
          docker run -d --name gcc-postgrest-ci --network host \
            -e PGRST_DB_URI='postgres://postgres:gcc_ci_disposable_only@127.0.0.1:5432/gcc_v231_http_ci' \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$GCC_TEST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3400 \
            postgrest/postgrest:v12.2.12
          trap 'docker logs gcc-postgrest-ci --tail 30 || true; docker rm -f gcc-postgrest-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3400/ >/dev/null 2>&1; then ready=1; break; fi
            sleep .5
          done
          if [ "$ready" -ne 1 ]; then echo 'PostgREST failed startup'; exit 1; fi
          node scripts/gcc-postgrest-security-smoke.mjs
