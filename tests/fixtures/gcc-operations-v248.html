<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="app"><main id="test-root" class="gct-portal"></main></div><script type="module">
import '/src/styles/global.css';import '/src/styles/teacherSelfService.css';import {mountTeacherOperationsV248} from '/src/pages/teacher/TeacherOperationsV248.js';import {operationsHashV248} from '/src/lib/teacherOperationsV248.js';
const assert=(x,m)=>{if(!x)throw Error(m)};
const root=document.querySelector('#test-root'),id='30000000-0000-0000-0000-000000000001',tid='20000000-0000-0000-0000-000000000001',other='20000000-0000-0000-0000-000000000002',rid='40000000-0000-0000-0000-000000000002';
const session={offer_id:id,title:'Global exchange — international schools',starts_at:'2027-01-01T00:00:00Z',ends_at:'2027-01-01T01:00:00Z',timezone:'Asia/Tokyo'};
const host={...session,role:'host',teacher_id:tid,revision:0,room_count:2,members:[{teacher_id:tid,school:'Host School',teacher:'Host Teacher',country:'JP',expected:1,finalized:true,is_host:true,students:[{id:'student-a',name:'A',grade:'10'}]},{teacher_id:other,school:'Partner School',teacher:'Partner Teacher',country:'PH',expected:1,finalized:true,students:[{id:'student-b',name:'B',grade:'11'}]}],requests:[{id:rid,teacher_id:other,teacher:'Partner Teacher',school:'Partner School',students:1,status:'pending'}],chart:null,published:false,messages:[],pairs:[],facilitators:[],zoom_url:'',ready:true};
let state=structuredClone(host);const people=()=>state.members.flatMap(m=>m.students.map(p=>({...p,school:m.school})));
const chart=()=>state.members.flatMap((m,i)=>m.students.map((p,j)=>({...p,student_id:p.id,teacher_id:m.teacher_id,student_no:j+1,school:m.school,country:m.country,room:state.pairs.length?1:i+1})));
const rpc=async(offer,action='read',data={})=>{assert(offer===id,'wrong offer');if(action!=='read'){assert(data.revision===state.revision,'stale UI revision');state.revision++}
 if(action==='review'){state.requests[0].status=data.decision;state.messages.push({request_id:rid,sender_id:tid,sender:'Host Teacher',body:'Accepted',registration_link:true,created_at:session.starts_at})}
 if(action==='message')state.messages.push({request_id:rid,sender_id:tid,sender:'Host Teacher',body:data.body,registration_link:data.registration_link,created_at:session.starts_at});
 if(action==='save_roster'){state.members.find(m=>m.teacher_id===data.teacher_id).students=data.students;assert(data.students[0].id==='student-a','stable identity')}
 if(action==='save_pairs')state.pairs=data.pairs;
 if(action==='arrange'){state.room_count=data.room_count;state.chart=chart()}
 if(action==='save_plan'){assert(data.plan.length===2,'plan rows');for(const p of state.chart)p.room=data.plan.find(x=>x.student_id===p.student_id).room}
 if(action==='save_facilitators')state.facilitators=data.facilitators.map(x=>({...x,teacher:'Host Teacher',school:'Host School'}));
 if(action==='save_zoom')state.zoom_url=data.zoom_url;
 if(action==='publish')state.published=true;
 return structuredClone({...state,people:state.role==='host'?people():null});
};
window.confirm=()=>true;const settle=()=>new Promise(r=>setTimeout(r,35));const click=async txt=>{const b=[...root.querySelectorAll('button')].find(b=>b.textContent.trim()===txt);assert(b,'missing '+txt);b.click();await settle()};
const step=async txt=>{const b=[...root.querySelectorAll('.gcc249-step')].find(b=>b.textContent.includes(txt));assert(b,'missing step '+txt);b.click();await settle()};
const checkLayout=()=>{const frame=root.getBoundingClientRect();for(const el of root.querySelectorAll('.gcc248-panel,.gcc249-step,.gcc249-stat,.gcc248-share,.gcc249-student-row,.gcc248-room,textarea,input,select,button')){const r=el.getBoundingClientRect();if(!r.width||!r.height)continue;assert(r.left>=frame.left-2&&r.right<=frame.right+2,'overflow '+el.tagName+' '+el.className)}};
try{
 await mountTeacherOperationsV248(root,{id,tab:'register'},{rpc});assert(root.querySelectorAll('.gcc249-step').length===5,'five steps');assert(root.querySelector('.gcc248-share input').value.endsWith(operationsHashV248(id)),'stable registration URL');checkLayout();
 await step('Review requests');await click('Accept');assert(state.messages.length===1,'approval invitation');
 const message=root.querySelector('textarea');message.value='Hello partner';await click('Send message');assert(state.messages.length===2,'message saved');checkLayout();
 await step('Registrations');const input=root.querySelector('.gcc249-student-row input');input.value='A revised';input.dispatchEvent(new Event('input'));await click('Confirm final registration');assert(state.members[0].students[0].name==='A revised','roster saved');checkLayout();
 await step('Arrange rooms');const pairSelectors=root.querySelectorAll('.gcc249-two select');pairSelectors[0].value='student-a';pairSelectors[1].value='student-b';await click('Add fixed pair');await click('Save fixed pairs');assert(state.pairs.length===1,'pair saved');
 await click('Arrange / rearrange rooms');const picker=root.querySelector('.gcc248-room select');picker.value='2';picker.dispatchEvent(new Event('change'));await click('Save room adjustments');assert(state.chart.every(x=>x.room===2),'pair moved together');
 const fac=root.querySelectorAll('.gcc248-panel select');const facilitator=[...root.querySelectorAll('label')].find(x=>x.textContent.includes('Host Teacher')&&x.querySelector('select')).querySelector('select');facilitator.value='1';await click('Save facilitator placements');assert(state.facilitators.length===1,'facilitator saved');checkLayout();
 await step('Publish & share');root.querySelector('input[type=url]').value='https://zoom.us/j/123456789';await click('Save Zoom link');await click('Publish room chart');assert(state.published,'publication');assert(root.querySelector('a[href^="https://zoom.us/"]'),'zoom link');checkLayout();
 state={...state,role:'participant',teacher_id:other,request_id:rid,members:[state.members[1]],requests:null};await mountTeacherOperationsV248(root,{id,tab:'chart'},{rpc});
 assert(!root.textContent.includes('Arrange / rearrange rooms'),'no host tools');assert(root.querySelectorAll('.gcc248-room').length===2,'published chart');await step('My registration');assert(root.querySelectorAll('.gcc249-student-row').length===1,'only own class');await step('Private messages');assert(root.textContent.includes('Hello partner'),'own private messages');checkLayout();
 state={...session,role:'applicant',request_status:'none',can_apply:true,members:[]};let submitted=false;await mountTeacherOperationsV248(root,{id,tab:'register'},{rpc,apply:async()=>{submitted=true;state={...state,request_status:'pending',can_apply:false}}});await click('Send join request');assert(submitted&&root.textContent.includes('pending'),'application');checkLayout();
 document.body.dataset.result='pass';
}catch(e){document.body.dataset.result='fail';const p=document.createElement('pre');p.id='fixture-error';p.textContent=e.stack||e.message;document.body.append(p)}
</script></body></html>
