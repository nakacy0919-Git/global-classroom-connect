<rect x="50" y="643" width="575" height="42" rx="21" fill="white"/><text x="337" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-weight="850" font-size="21" fill="#117840">Each student joins on their own device.</text>
<rect x="23" y="719" width="629" height="285" rx="24" fill="#ffedeb" stroke="#f5b1b5" stroke-width="4"/>
<rect x="38" y="736" width="598" height="68" rx="20" fill="url(#red)"/><text x="337" y="782" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="900" fill="white">✕  Not correct</text>
