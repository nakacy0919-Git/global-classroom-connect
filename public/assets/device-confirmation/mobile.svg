<rect x="254" y="896" width="167" height="65" rx="10" fill="#5f86a3" stroke="#9ec3d3" stroke-width="4"/><rect x="264" y="904" width="147" height="46" rx="4" fill="#c6e6f6"/>
<rect x="50" y="967" width="575" height="30" rx="15" fill="white"/><text x="337" y="989" font-family="Arial,sans-serif" font-weight="850" font-size="19" text-anchor="middle" fill="#bd2635">Do not share one device with multiple students.</text>
<rect x="45" y="1024" width="585" height="91" rx="24" fill="#cbeaff" stroke="#92cde8" stroke-width="3"/>
<text x="337" y="1056" font-family="Arial,sans-serif" text-anchor="middle" font-size="23" font-weight="850" fill="#143866">Individual breakout rooms need</text><text x="337" y="1082" font-family="Arial,sans-serif" text-anchor="middle" font-size="23" font-weight="850" fill="#143866">individual devices.</text>
<rect x="72" y="1134" width="531" height="49" rx="23" fill="url(#blue)"/><text x="337" y="1166" font-size="22" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" fill="white">Confirm this before registration.</text></svg>