<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 675 1200" role="img" aria-labelledby="title desc"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1fcff"/><stop offset=".56" stop-color="#d9f1ff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2aac4d"/><stop offset="1" stop-color="#087a31"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5660"/><stop offset="1" stop-color="#db1d31"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0e579d"/><stop offset="1" stop-color="#06336d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".12"/></filter></defs><title id="title">Before You Register — one student, one device</title><desc id="desc">Correct: each student has a separate device. Not correct: students share one device.</desc>
<rect width="675" height="1200" rx="25" fill="url(#bg)"/>
<rect x="96" y="26" width="483" height="48" rx="23" fill="url(#blue)"/><text x="337" y="56" font-family="Arial,sans-serif" font-size="25" font-weight="900" fill="white" text-anchor="middle">GLOBAL CLASSROOM CONNECT</text>
<text x="337" y="135" font-family="Arial,sans-serif" font-size="61" font-weight="900" fill="#0b3169" text-anchor="middle">Before You</text>
<text x="337" y="201" font-family="Arial,sans-serif" font-size="68" font-weight="900" fill="#147ce2" text-anchor="middle">Register</text>
<text x="337" y="259" font-family="Arial,sans-serif" font-size="31" font-weight="850" fill="#208e33" text-anchor="middle">Each student needs</text><text x="337" y="294" font-family="Arial,sans-serif" font-size="31" font-weight="850" fill="#2077c0" text-anchor="middle">their own device.</text>
<text x="337" y="328" font-family="Arial,sans-serif" font-size="19" font-weight="740" fill="#15365f" text-anchor="middle">One student = one device.</text><text x="337" y="355" font-family="Arial,sans-serif" font-size="17" fill="#15365f" text-anchor="middle">Do not share with two or three students.</text>
<rect x="23" y="380" width="629" height="318" rx="24" fill="#e9ffe9" stroke="#91dca3" stroke-width="4"/>
<rect x="38" y="399" width="598" height="68" rx="20" fill="url(#green)"/><text x="337" y="446" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="white">✓  Correct</text>
