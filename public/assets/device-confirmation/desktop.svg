<g opacity=".14" fill="#008bbd"><circle cx="112" cy="110" r="55"/><circle cx="1048" cy="100" r="79"/><path d="M0 315Q200 270 400 314T800 320T1200 306V480H0Z"/></g>
<rect x="364" y="20" width="472" height="49" rx="24" fill="url(#blue)"/><text x="600" y="53" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="900" fill="#fff">🌐  GLOBAL CLASSROOM CONNECT</text>
<text x="600" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="66" font-weight="900" fill="#07345f">Before You <tspan fill="#147de4">Register</tspan></text>
<text x="600" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#126c31">Each student needs their own device.</text>
<text x="600" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="650" fill="#142f56">One student = one device. Do not share with two or three students.</text>
