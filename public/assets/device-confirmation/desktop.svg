<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1fcff"/><stop offset=".56" stop-color="#d9f1ff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2aac4d"/><stop offset="1" stop-color="#087a31"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5660"/><stop offset="1" stop-color="#db1d31"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0e579d"/><stop offset="1" stop-color="#06336d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".12"/></filter></defs><title id="title">Before You Register — one student, one device</title><desc id="desc">Correct: three students use one device each. Not correct: three students share one computer.</desc>
