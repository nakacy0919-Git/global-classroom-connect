<rect x="66" y="493" width="480" height="31" rx="16" fill="white"/><text x="306" y="514" text-anchor="middle" font-family="Arial,sans-serif" font-weight="850" font-size="18" fill="#17743e">Each student joins on their own device.</text>
<rect x="653" y="493" width="480" height="31" rx="16" fill="white"/><text x="893" y="514" text-anchor="middle" font-family="Arial,sans-serif" font-weight="850" font-size="17" fill="#bd2635">Do not share one device with multiple students.</text>
<rect x="150" y="552" width="900" height="61" rx="28" fill="#caebff" stroke="#98ccea"/><text x="600" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="800" fill="#10375f">Individual breakout rooms need individual devices.</text><text x="600" y="601" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#1b4668">Sharing devices causes room assignment problems.</text>
<rect x="279" y="625" width="642" height="39" rx="19" fill="url(#blue)"/><text x="600" y="651" font-size="20" font-family="Arial,sans-serif" text-anchor="middle" font-weight="850" fill="white">Please confirm this before registration.</text></svg>